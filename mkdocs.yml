site_name: fleetctl
site_description: One command plane for your machines.
site_url: https://phvv.me/fleetctl/
repo_url: https://github.com/phvv-me/fleetctl
repo_name: phvv-me/fleetctl
copyright: Apache-2.0 · Pedro Valois

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.integrate

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Commands: commands.md
  - Configuration: configuration.md
  - Examples: examples.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      fallback_to_default: true
      languages:
        - locale: en
          name: 🇺🇸 English
          default: true
  - llmstxt:
      markdown_description: One command plane that dispatches your repo to any host, runs it under whatever scheduler that host has, and pulls the results back.
      full_output: llms-full.txt
      sections:
        Usage:
          - index.md
          - how-it-works.md
          - commands.md
          - examples.md
        Reference:
          - configuration.md
