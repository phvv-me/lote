[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lote"
version = "0.0.3"
description = "One command plane for your machines | dispatch jobs to any host, run them under any scheduler, pull results back."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Pedro Valois", email = "contact@phvv.me" }]
keywords = [
  "job-scheduler",
  "hpc",
  "slurm",
  "pbs",
  "pueue",
  "ssh",
  "remote-execution",
  "cluster",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Distributed Computing",
  "Topic :: System :: Clustering",
]
dependencies = [
  "cyclopts>=4",
  "jinja2>=3.1",
  "loguru>=0.7",
  "patos>=0.0.1",
  "pendulum>=3",
  "plumbum>=2",
  "pydantic>=2.13",
  "pydantic-settings>=2.3",
  "rich>=13",
  "tenacity>=9",
  "watchfiles>=0.22",
  "pathspec>=0.12",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pyrefly>=1",
  "mypy>=1.11",
  "pytest>=8",
  "hypothesis>=6.100",
  "pytest-cov>=5",
  "syrupy>=4",
  "pytest-subprocess>=1.5",
  "pytest-mock>=3.14",
  "faker>=30",
  "dirty-equals>=0.8",
  "inline-snapshot>=0.13",
]
docs = ["mkdocs-material>=9.5", "mkdocs-static-i18n>=1.2"]

[project.scripts]
lote = "lote.cli:main"

[project.urls]
Homepage = "https://phvv.me/lote"
Documentation = "https://phvv.me/lote"
Repository = "https://github.com/phvv-me/lote"
Issues = "https://github.com/phvv-me/lote/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lote"]

[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
files = ["src"]
mypy_path = "src"
namespace_packages = false

[[tool.mypy.overrides]]
module = ["psutil.*"]
ignore_missing_imports = true

# `disallow_any_explicit` fires on every pydantic model definition: `BaseModel`'s
# own stubbed methods (`model_validate(obj: Any)`, `model_dump() -> dict[str, Any]`,
# ...) carry the only `Any` here, surfaced at each subclass's class statement. That
# is an irreducible third-party-stub gap, not lote code, so `explicit-any` is scoped
# off for the modules that define models; the flag still guards everything else.
[[tool.mypy.overrides]]
module = [
  "lote.base",
  "lote.cache",
  "lote.environment",
  "lote.history",
  "lote.jobspec",
  "lote.monitor",
  "lote.reconcile",
  "lote.models.config",
  "lote.models.node",
  "lote.models.snapshot",
  "lote.models.target",
  "lote.schedulers.base",
  "lote.clients.pbs.job_dependency",
  "lote.clients.pbs.job_info",
  "lote.clients.pbs.resource_spec",
  "lote.clients.pueue.task",
  "lote.clients.slurm.job_info",
]
disable_error_code = ["explicit-any"]

[tool.pytest.ini_options]
addopts = "-q -ra --strict-markers --cov=lote --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["lote"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  '^\s*\.\.\.\s*$',
]
