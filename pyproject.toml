[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lote"
version = "0.0.1"
description = "One command plane for your machines | dispatch jobs to any host, run them under any scheduler, pull results back."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Pedro Valois", email = "contact@phvv.me" }]
keywords = [
  "job-scheduler",
  "hpc",
  "slurm",
  "pbs",
  "pueue",
  "ssh",
  "remote-execution",
  "cluster",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Distributed Computing",
  "Topic :: System :: Clustering",
]
dependencies = [
  "fire>=0.6",
  "loguru>=0.7",
  "pendulum>=3",
  "plumbum>=1.8",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "rich>=13",
  "tinydb>=4.8",
  "watchfiles>=0.22",
  "pathspec>=0.12",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pyrefly>=1",
  "mypy>=1.11",
  "pytest>=8",
  "hypothesis>=6.100",
  "pytest-cov>=5",
  "syrupy>=4",
  "pytest-subprocess>=1.5",
  "pytest-mock>=3.14",
  "faker>=30",
  "dirty-equals>=0.8",
]
docs = ["mkdocs-material>=9.5", "mkdocs-llmstxt>=0.2", "mkdocs-static-i18n>=1.2"]

[project.scripts]
lote = "lote.cli:app"

[project.urls]
Homepage = "https://phvv.me/lote"
Documentation = "https://phvv.me/lote"
Repository = "https://github.com/phvv-me/lote"
Issues = "https://github.com/phvv-me/lote/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lote"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
mypy_path = "src"
namespace_packages = false

[[tool.mypy.overrides]]
module = ["plumbum.*", "fire.*", "tinydb.*", "psutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q -ra --strict-markers --cov=lote --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["lote"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 99
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  '^\s*\.\.\.\s*$',
]
