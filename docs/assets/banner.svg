<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">lote</title>
  <desc id="desc">Dispatch jobs to any machine, under any scheduler.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#140e2e"/>
      <stop offset="0.55" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="42" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="170" fill="#7c3aed" opacity="0.16"/>
  <circle cx="320" cy="320" r="150" fill="#a78bfa" opacity="0.06"/>

  <!-- the orchestration graph: one control node wired out to a cluster of hosts -->
  <g stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <path d="M1000 118 L862 222"/>
    <path d="M1000 118 L1138 222"/>
    <path d="M1000 118 L936 320"/>
    <path d="M1000 118 L1064 320"/>
    <path d="M862 222 L936 320"/>
    <path d="M1138 222 L1064 320"/>
    <path d="M936 320 L1064 320"/>
  </g>
  <circle cx="1000" cy="118" r="27" fill="#a78bfa"/>
  <circle cx="1000" cy="118" r="27" fill="none" stroke="#c4b5fd" stroke-width="3"/>
  <g fill="#8b5cf6">
    <circle cx="862" cy="222" r="16"/>
    <circle cx="1138" cy="222" r="16"/>
    <circle cx="936" cy="320" r="16"/>
    <circle cx="1064" cy="320" r="16"/>
  </g>

  <text x="96" y="244" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="178" font-weight="800" letter-spacing="-4" fill="#ffffff">lote</text>
  <text x="104" y="298" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="32" font-weight="500" letter-spacing="0.5" fill="#c4b5fd">dispatch work to any machine</text>
</svg>
