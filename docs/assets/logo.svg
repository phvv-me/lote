<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none"
     stroke="#7c3aed" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5">
  <title>lote, one node orchestrating a cluster</title>
  <!-- edges: the control node wired out to its hosts -->
  <g opacity="0.9">
    <path d="M60 32 L26 82"/>
    <path d="M60 32 L94 82"/>
    <path d="M60 32 L60 98"/>
    <path d="M26 82 L60 98"/>
    <path d="M94 82 L60 98"/>
  </g>
  <!-- the control node -->
  <circle cx="60" cy="32" r="12" fill="#7c3aed" stroke="none"/>
  <!-- the hosts -->
  <g fill="#a78bfa" stroke="none">
    <circle cx="26" cy="82" r="8.5"/>
    <circle cx="94" cy="82" r="8.5"/>
    <circle cx="60" cy="98" r="8.5"/>
  </g>
</svg>
