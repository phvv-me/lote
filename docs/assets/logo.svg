<svg xmlns="http://www.w3.org/2000/svg" width="120" height="104" viewBox="0 0 120 104" fill="none"
     stroke="#eab308" stroke-linecap="round" stroke-linejoin="round">
  <title>fleet, one bridge over a fleet of machines</title>
  <g stroke-width="4">
    <!-- spokes: the control plane dispatching out to each host -->
    <path d="M50 45 L27 27"/>
    <path d="M70 45 L93 27"/>
    <path d="M50 59 L27 79"/>
    <path d="M70 59 L93 79"/>
    <!-- the hub: your command plane -->
    <circle cx="60" cy="52" r="12"/>
    <!-- the fleet: machines it reaches -->
    <g fill="#eab308" stroke="none">
      <circle cx="24" cy="26" r="6"/>
      <circle cx="96" cy="26" r="6"/>
      <circle cx="24" cy="80" r="6"/>
      <circle cx="96" cy="80" r="6"/>
    </g>
  </g>
</svg>
