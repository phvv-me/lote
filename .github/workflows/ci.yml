name: CI

on:
  pull_request:
  workflow_call: # publish.yml runs this exact gate on main before publishing

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      # the shared chefe action owns the uv version, the cache paths and the cache key in one
      # place instead of each repository hand rolling its own
      - uses: phvv-me/chefe/.github/actions/setup@main
        with:
          mode: uv
          python-version: ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pyrefly check
      - run: uv run pytest -q --cov=lote
