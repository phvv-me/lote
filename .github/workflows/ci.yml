name: CI

on:
  pull_request:
  workflow_call: # publish.yml runs this exact gate before publishing
  workflow_dispatch: # manual runs, which is how this repository is checked while it is frozen

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      # A published package stands on its own, so the bootstrap is the official uv action and
      # nothing of ours. A shared house action would make every release depend on another
      # repository's default branch, which is the coupling this file exists to avoid.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # One sync names every extra the gate needs, and the `uv run` steps below reuse that
      # environment without pruning it.
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pyrefly check
      - run: uv run pytest -q --cov=lote
